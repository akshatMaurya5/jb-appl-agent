# form-categories.yml — question→category taxonomy for the autonomous form engine.
# SYSTEM LAYER (per DATA_CONTRACT.md): structure, matchers, and option aliases
# only. Candidate answer VALUES never live here — `answer` holds a pointer
# (a profile key path or an authorization key path) whose value the engine
# resolves from config/profile.yml at runtime. User overrides merge in via
# config/profile.yml → form_categories.
#
# Matching: `question_patterns` and `excludes` are regular expressions tested
# against the question context after normalize() (lowercase, [a-z0-9 ] only —
# see lib/autofill-form-utils.mjs). Patterns are matched in `priority` order
# (lower first); `excludes` veto a category when any of them matches, so a
# combined question falls through to the more specific category. A question
# matching nothing lands on `unclassified`.
#
# Flags:
#   sensitive   — protected-grounds, consent, legal, or eligibility territory.
#   llm_allowed — may the native sub-agent be asked when deterministic answers
#                 fail? Invariant: sensitive ⇒ llm_allowed: false.
#   answer.source — profile (dot-path key below) | policy (authorization_key
#                 must be true in the profile) | faq (similarity tiers) |
#                 planner (native sub-agent) | cv | none.
version: 1

categories:
  # ---- Submission attestations (always gated on explicit user authorization) ----
  - id: terms-consent
    priority: 10
    sensitive: true
    llm_allowed: false
    question_patterns:
      - 'terms and conditions'
      - 'terms of (service|use)'
      - 'agree to the terms'
      - 'accept the terms'
      - 'applicant agreement'
    excludes:
      - 'arbitrat'
    answer:
      source: policy
      authorization_key: application_authorizations.required_submission_terms.all_companies
    option_aliases:
      - ['i agree', 'i accept', 'agree', 'accept', 'yes i agree', 'yes i accept', 'i consent']
      - ['yes', 'ok']

  - id: privacy-consent
    priority: 11
    sensitive: true
    llm_allowed: false
    question_patterns:
      - 'privacy (policy|notice)'
      - 'applicant privacy'
      - 'data privacy'
      - 'data protection'
      - 'data processing'
      - 'personal data'
      - 'gdpr'
    excludes: []
    answer:
      source: policy
      authorization_key: application_authorizations.required_submission_terms.all_companies
    option_aliases:
      - ['i agree', 'i accept', 'agree', 'accept', 'yes i agree', 'i consent']
      - ['i have read and acknowledge', 'i acknowledge', 'acknowledge']

  - id: legal-acknowledgement
    priority: 12
